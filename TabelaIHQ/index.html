<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILIS - Tabela IHQ (V11 - Customizável)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ESTILOS (Mantidos iguais) */
        .erro-input { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        .msg-erro { color: #ef4444; font-size: 10px; display: none; position: absolute; bottom: -14px; left: 2px; }
        #modalPaineis { display: none; }
        .lista-scroll { overflow-y: auto; max-height: 400px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; background: #ffffff; }
        .laudo-preview { font-family: 'Times New Roman', serif; color: black; line-height: 1.1; }
        
        .custom-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; background: white;
            border: 2px solid #3b82f6; border-top: none; border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; z-index: 1000; display: none;
        }
        .dropdown-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f1f5f9; transition: background 0.15s; }
        .dropdown-item:hover { background: #eff6ff; }
        .dropdown-label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: bold; padding: 6px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .input-with-dropdown-active { border-color: #3b82f6 !important; border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; z-index: 1001; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>

        const sugestoesResultados = {
            "generic": ["POSITIVO nas células neoplásicas", "NEGATIVO nas células neoplásicas"],

            "RE": ["POSITIVO forte em ___% das células neoplásicas", "POSITIVO moderado", "POSITIVO fraco"],

        };

        // Painéis Fixos (Padrão do Sistema)
        const paineisPadrao = {
            "MAMA": ["RE", "RP", "Ki-67", "HER2"],
            "MMR (Instabilidade)": ["MLH1", "MSH2", "MSH6", "PMS2"],
            "ENDOMÉTRIO": ["MLH1", "MSH2", "MSH6", "PMS2", "p53"],
            "PULMÃO (Adeno)": ["TTF-1", "p63"],
            "PROSTATA": ["34βE12", "p63", "Racemase"]

        // Carregar Painéis do Usuário (localStorage)
        let paineisUsuario = JSON.parse(localStorage.getItem('guilis_paineis_usuario')) || {};

        // ==========================================
        // 2. LÓGICA DE INTERFACE E DROPDOWNS
        // ==========================================
        let selectedDropdownIndex = -1;

        function handleKeyboardNavigation(e, index, type) {
            const dropdown = document.querySelector(`#linha-${index} .dropdown-${type}`);
            if (!dropdown || dropdown.style.display === 'none') return;
            const items = dropdown.querySelectorAll('.dropdown-item');
            if (e.key === 'ArrowDown') { e.preventDefault(); selectedDropdownIndex = Math.min(selectedDropdownIndex + 1, items.length - 1); atualizarHighlight(items); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); selectedDropdownIndex = Math.max(selectedDropdownIndex - 1, 0); atualizarHighlight(items); }
            else if (e.key === 'Enter') { e.preventDefault(); if (selectedDropdownIndex > -1 && items[selectedDropdownIndex]) items[selectedDropdownIndex].click(); }
            else if (e.key === 'Escape') fecharTodosDropdowns();
        }

        function atualizarHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === selectedDropdownIndex) { item.style.background = '#eff6ff'; item.scrollIntoView({ block: 'nearest' }); }
                else item.style.background = '';
            });
        }

        function fecharTodosDropdowns() {
            selectedDropdownIndex = -1;
            document.querySelectorAll('.custom-dropdown').forEach(d => {
                d.style.display = 'none';
                const input = d.previousElementSibling;
                if(input) input.classList.remove('input-with-dropdown-active');
            });
        }

        document.addEventListener('click', function(e) { if (!e.target.closest('.linha-input')) fecharTodosDropdowns(); });

        function mostrarDropdownAnticorpos(index) {
            fecharTodosDropdowns();
            const linha = document.getElementById(`linha-${index}`);
            const input = linha.querySelector('.ant');
            const dropdown = linha.querySelector('.dropdown-anticorpos');
            const termo = input.value.toLowerCase();
            const filtrados = Object.keys(estoqueIHQ).filter(k => k.toLowerCase().includes(termo)).sort();
            
            let html = '';
            if (filtrados.length === 0) html = '<div class="dropdown-empty">Nenhum encontrado</div>';
            else filtrados.forEach(ant => html += `<div class="dropdown-item" onclick="selecionarAnticorpo(${index}, '${ant.replace(/'/g, "\\'")}')">${ant}</div>`);
            
            dropdown.innerHTML = html; dropdown.style.display = 'block'; input.classList.add('input-with-dropdown-active');
        }

        function selecionarAnticorpo(index, anticorpo) {
            const linha = document.getElementById(`linha-${index}`);
            const input = linha.querySelector('.ant');
            input.value = anticorpo;
            fecharTodosDropdowns();
            processarAnticorpo(index, input);
            const inputClone = linha.querySelector('.clo');
            if (!inputClone.disabled) { inputClone.focus(); setTimeout(() => inputClone.click(), 100); }
        }

        function mostrarDropdownClones(index) {
            fecharTodosDropdowns();
            const linha = document.getElementById(`linha-${index}`);
            const input = linha.querySelector('.clo');
            if(input.dataset.clones) {
                const clones = JSON.parse(input.dataset.clones);
                if(clones.length === 1) { input.value = clones[0]; sincronizar(); return; }
                const dropdown = linha.querySelector('.dropdown-clones');
                let html = '';
                clones.forEach(clone => html += `<div class="dropdown-item" onclick="selecionarClone(${index}, '${clone.replace(/'/g, "\\'")}')">${clone}</div>`);
                dropdown.innerHTML = html; dropdown.style.display = 'block'; input.classList.add('input-with-dropdown-active');
            }
        }

        function selecionarClone(index, clone) {
            const linha = document.getElementById(`linha-${index}`);
            linha.querySelector('.clo').value = clone;
            fecharTodosDropdowns(); sincronizar();
            const res = linha.querySelector('.res'); if(res) res.focus();
        }

        function mostrarDropdownResultados(index) {
            fecharTodosDropdowns();
            const linha = document.getElementById(`linha-${index}`);
            const ant = linha.querySelector('.ant').value.trim();
            const dropdown = linha.querySelector('.dropdown-resultados');
            
            let html = '';
            const sugs = [...(sugestoesResultados[ant] || []), ...sugestoesResultados.generic];
            if(sugestoesResultados[ant]) html += `<div class="dropdown-label">Sugestões para ${ant}</div>`;
            sugs.forEach(s => html += `<div class="dropdown-item" onclick="selecionarResultado(${index}, '${s.replace(/'/g, "\\'")}')">${s}</div>`);
            
            dropdown.innerHTML = html; dropdown.style.display = 'block'; linha.querySelector('.res').classList.add('input-with-dropdown-active');
        }

        function selecionarResultado(index, texto) {
            const input = document.getElementById(`linha-${index}`).querySelector('.res');
            input.value = texto;
            if(texto.includes('___')) { const p = texto.indexOf('___'); input.focus(); input.setSelectionRange(p, p+3); }
            fecharTodosDropdowns(); sincronizar();
        }

        function processarAnticorpo(index, elemento) {
            const valor = elemento.value.trim();
            const linha = document.getElementById(`linha-${index}`);
            const inputClone = linha.querySelector('.clo');
            const spanErro = linha.querySelector('.msg-erro');
            const chave = Object.keys(estoqueIHQ).find(k => k.toLowerCase() === valor.toLowerCase());
            
            if (chave) {
                elemento.classList.remove('erro-input');
                spanErro.style.display = 'none';
                inputClone.disabled = false;
                inputClone.dataset.clones = JSON.stringify(estoqueIHQ[chave]);
                inputClone.value = estoqueIHQ[chave].length === 1 ? estoqueIHQ[chave][0] : '';
            } else {
                elemento.classList.add('erro-input');
                spanErro.style.display = (valor === "") ? 'none' : 'block';
                inputClone.disabled = true; inputClone.value = '';
            }
            sincronizar();
        }

        // ==========================================
        // 3. SINCRONIZAÇÃO E TABELA
        // ==========================================
        function sincronizar() {
            const b = "1.8pt solid black";
            let h = `<table style="border-collapse:collapse; width:523pt; font-family:'Trade Gothic Next Rounded', Arial, sans-serif; border:${b}; table-layout:fixed;">`;
            h += `<tr style="background:#D9D9D9; font-weight:bold; height:21.5pt;"><th style="border:${b}; width:80pt; font-size:14px; text-align:left; padding-left:8px;">ANTICORPO</th><th style="border:${b}; width:129pt; font-size:14px; text-align:left; padding-left:8px;">CLONE-FABRICANTE</th><th style="border:${b}; width:314pt; font-size:14px; text-align:left; padding-left:8px;">RESULTADO</th></tr>`;
            
            let temLinhas = false;
            document.querySelectorAll('.linha-input').forEach(div => {
                const a = div.querySelector('.ant').value.trim();
                const c = div.querySelector('.clo').value;
                const r = div.querySelector('.res').value;
                const chave = Object.keys(estoqueIHQ).find(k => k.toLowerCase() === a.toLowerCase());
                if (chave) {
                    h += `<tr style="height:15pt;"><td style="border:${b}; padding:0 8px; font-size:14px;">${chave}</td><td style="border:${b}; padding:0 8px; font-size:14px;">${c}</td><td style="border:${b}; padding:0 8px; font-size:14px;">${r}</td></tr>`;
                    temLinhas = true;
                }
            });
            document.getElementById('area-tabela').innerHTML = temLinhas ? h + `</table>` : '';
        }

        function criarLinhaUI(index) {
            const div = document.createElement('div');
            div.className = 'flex gap-1 items-start linha-input relative mb-1';
            div.id = `linha-${index}`;
            div.innerHTML = `
                <div class="flex flex-col w-[25%] relative">
                    <input type="text" placeholder="Anticorpo..." oninput="processarAnticorpo(${index}, this); mostrarDropdownAnticorpos(${index})" onfocus="mostrarDropdownAnticorpos(${index})" onkeydown="handleKeyboardNavigation(event, ${index}, 'anticorpos')" class="ant border p-2 rounded w-full text-sm outline-none bg-white focus:border-blue-500">
                    <div class="custom-dropdown dropdown-anticorpos"></div>
                    <span class="msg-erro">Não cadastrado</span>
                </div>
                <div class="clone-container w-[35%] relative">
                    <input type="text" placeholder="---" readonly onfocus="if(!this.disabled) mostrarDropdownClones(${index})" onclick="if(!this.disabled) mostrarDropdownClones(${index})" onkeydown="handleKeyboardNavigation(event, ${index}, 'clones')" class="clo border p-2 rounded w-full text-sm outline-none bg-gray-50 cursor-pointer focus:border-blue-500" disabled>
                    <div class="custom-dropdown dropdown-clones"></div>
                </div>
                <div class="w-[40%] relative">
                    <input type="text" placeholder="Resultado" onfocus="mostrarDropdownResultados(${index})" oninput="sincronizar()" onkeydown="handleKeyboardNavigation(event, ${index}, 'resultados')" class="res border p-2 rounded w-full text-sm outline-none focus:border-blue-500">
                    <div class="custom-dropdown dropdown-resultados"></div>
                </div>`;
            return div;
        }

        function adicionarLinha() {
            const c = document.getElementById('container-inputs');
            c.appendChild(criarLinhaUI(c.children.length));
        }

        function limparTabela() {
            if(confirm("Limpar tela?")) {
                document.getElementById('container-inputs').innerHTML = '';
                for(let i=0; i<8; i++) adicionarLinha();
                sincronizar();
            }
        }

        function copiarTabela() {
            const conteudo = document.getElementById('area-tabela').innerHTML;
            if (!conteudo) return alert("Tabela vazia!");
            const b = new Blob([conteudo], { type: "text/html" });
            navigator.clipboard.write([new ClipboardItem({ "text/html": b })]).then(() => alert("Copiado!"));
        }

        // ==========================================
        // 4. GERENCIAMENTO DE PAINÉIS (PADRÃO + USUÁRIO)
        // ==========================================
        
        function getTodosPaineis() {
            return { ...paineisPadrao, ...paineisUsuario };
        }

        function atualizarSelectPaineis() {
            const select = document.getElementById('select-paineis-ui');
            select.innerHTML = '<option value="">Selecione um painel...</option>';
            const todos = getTodosPaineis();
            
            // Grupo Padrão
            const optGroupPadrao = document.createElement('optgroup');
            optGroupPadrao.label = "PADRÃO HUOL";
            Object.keys(paineisPadrao).sort().forEach(k => {
                const opt = document.createElement('option'); opt.value = k; opt.innerText = k.toUpperCase().replace(/_/g, " ");
                optGroupPadrao.appendChild(opt);
            });
            select.appendChild(optGroupPadrao);

            // Grupo Usuário
            if(Object.keys(paineisUsuario).length > 0) {
                const optGroupUser = document.createElement('optgroup');
                optGroupUser.label = "MEUS PAINÉIS";
                Object.keys(paineisUsuario).sort().forEach(k => {
                    const opt = document.createElement('option'); opt.value = k; opt.innerText = k.toUpperCase();
                    optGroupUser.appendChild(opt);
                });
                select.appendChild(optGroupUser);
            }
        }

        function aplicarPainel(id) {
            const todos = getTodosPaineis();
            if(!id || !todos[id]) return;
            const lista = todos[id];
            
            // Limpa tabela atual antes de aplicar (opcional, mas recomendado para evitar mistura)
            document.getElementById('container-inputs').innerHTML = '';
            
            lista.forEach(ant => {
                adicionarLinha();
                const linhas = document.querySelectorAll('.linha-input');
                const last = linhas[linhas.length-1];
                const input = last.querySelector('.ant');
                input.value = ant;
                processarAnticorpo(linhas.length-1, input);
            });
            
            // Adiciona algumas linhas extras vazias
            for(let i=0; i<3; i++) adicionarLinha();
        }

        // MODAL E EDIÇÃO
        function abrirModal() {
            document.getElementById('modalPaineis').style.display = 'flex';
            renderizarListaModal();
        }

        function fecharModal() {
            document.getElementById('modalPaineis').style.display = 'none';
        }

        function renderizarListaModal() {
            const cont = document.getElementById('listaPaineisVisual');
            cont.innerHTML = '';
            
            // Painéis do Usuário (Com botão excluir)
            if(Object.keys(paineisUsuario).length > 0) {
                cont.innerHTML += `<div class="p-3 bg-blue-50 text-xs font-bold text-blue-800 uppercase border-b">Meus Painéis Salvos</div>`;
                Object.keys(paineisUsuario).sort().forEach(k => {
                    cont.innerHTML += `
                        <div class="p-3 border-b flex justify-between items-center bg-white hover:bg-gray-50">
                            <div>
                                <b class="text-gray-800">${k}</b>
                                <p class="text-[10px] text-gray-500 mt-1">${paineisUsuario[k].join(', ')}</p>
                            </div>
                            <button onclick="excluirPainel('${k}')" class="text-red-500 hover:bg-red-100 p-2 rounded">🗑️</button>
                        </div>`;
                });
            }

            // Painéis Padrão (Apenas leitura)
            cont.innerHTML += `<div class="p-3 bg-gray-100 text-xs font-bold text-gray-600 uppercase border-b mt-4">Painéis Padrão (Fixo)</div>`;
            Object.keys(paineisPadrao).sort().forEach(k => {
                cont.innerHTML += `
                    <div class="p-3 border-b text-sm text-gray-500">
                        <b>${k.replace(/_/g, " ")}</b>: ${paineisPadrao[k].join(', ')}
                    </div>`;
            });
        }

        function salvarNovoPainel() {
            const nomeInput = document.getElementById('novo-painel-nome');
            const nome = nomeInput.value.trim().toUpperCase();
            
            if(!nome) return alert("Digite um nome para o painel.");
            if(paineisPadrao[nome]) return alert("Este nome é reservado pelo sistema.");
            
            // Coletar anticorpos válidos da tabela atual
            const lista = [];
            document.querySelectorAll('.linha-input').forEach(div => {
                const val = div.querySelector('.ant').value.trim();
                const chave = Object.keys(estoqueIHQ).find(k => k.toLowerCase() === val.toLowerCase());
                if(chave) lista.push(chave);
            });

            if(lista.length === 0) return alert("A tabela está vazia ou não tem anticorpos válidos reconhecidos.");

            // Salvar
            paineisUsuario[nome] = lista;
            localStorage.setItem('guilis_paineis_usuario', JSON.stringify(paineisUsuario));
            
            alert(`Painel "${nome}" salvo com sucesso!`);
            nomeInput.value = '';
            atualizarSelectPaineis();
            renderizarListaModal();
        }

        function excluirPainel(nome) {
            if(confirm(`Excluir o painel "${nome}"?`)) {
                delete paineisUsuario[nome];
                localStorage.setItem('guilis_paineis_usuario', JSON.stringify(paineisUsuario));
                atualizarSelectPaineis();
                renderizarListaModal();
            }
        }

        // Inicialização
        atualizarSelectPaineis();
        for(let i=0; i<8; i++) adicionarLinha();
        sincronizar();

    </script>
</body>
</html>
